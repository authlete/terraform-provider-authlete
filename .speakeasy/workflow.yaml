workflowVersion: 1.0.0
speakeasyVersion: 1.795.1
sources:
    Authlete-OAS:
        inputs:
            - location: https://raw.githubusercontent.com/authlete/openapi/main/spec_next.yaml
        overlays:
            - location: .speakeasy/terraform_overlay.yaml
        output: .speakeasy/out.openapi.yaml
        registry:
            location: registry.speakeasyapi.dev/authlete/sdk-workspace/authlete-oas
targets:
    authlete:
        target: terraform
        source: Authlete-OAS
