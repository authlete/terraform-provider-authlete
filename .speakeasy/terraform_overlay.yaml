overlay: 1.0.0
info:
  title: Authlete Terraform entity annotations
  version: 0.0.1
actions:
  # ---------- Entity: Service ----------
  - target: $.components.schemas.service
    description: Mark the service schema as a Terraform-managed entity
    update:
      x-speakeasy-entity: Service
      x-speakeasy-entity-version: 1

  # Services are created and deleted through the IdP (login.authlete.com), NOT
  # through the regional cluster's /api/service/create. The cluster endpoint
  # returns 200 with a real apiKey, but the service it makes is attached to no
  # organization: the IdP cannot find it under any apiServerId, it never reaches
  # the audit log, and every service-scoped call afterwards fails A457101 with
  # insufficient rights. It also cannot be deleted again. Only the IdP endpoint
  # registers a service against an organization.

  # KNOWN LIMITATION -- on-premise and dedicated cloud cannot create or delete
  # services. The IdP host is fixed at https://login.authlete.com and the
  # generator bakes it in as a constant. Declaring it as an OpenAPI server
  # variable was tried and does NOT help: Speakeasy surfaces server variables as
  # configurable provider attributes only for root-level servers, and resolves
  # per-operation ones to their default at generation time. Fixing this needs
  # either an SDK hook that rewrites the host, or Speakeasy support for
  # operation-level server variables. Do not re-attempt via the overlay --
  # this is now solved at the HTTP layer in internal/provider/idp_routing.go.

  - target: $.paths['/api/service'].post
    description: Service create (IdP)
    update:
      x-speakeasy-entity-operation: Service#create

  - target: $.paths['/api/service/remove'].post
    description: Service delete (IdP), the counterpart of the IdP create
    update:
      x-speakeasy-entity-operation: Service#delete

  # The IdP delete takes the service ID in the body rather than the path, so it
  # needs the same correlation the cluster path params get.
  - target: $.components.schemas.service_remove_idp_request.properties.serviceId
    description: Correlate the IdP delete body's serviceId to service.apiKey
    update:
      x-speakeasy-match: apiKey

  - target: $.paths['/api/{serviceId}/service/get'].get
    description: Service read
    update:
      x-speakeasy-entity-operation: Service#read

  - target: $.paths['/api/{serviceId}/service/update'].post
    description: Service update
    update:
      x-speakeasy-entity-operation: Service#update

  - target: $.paths['/api/{serviceId}/service/update'].post.requestBody
    description: Update body is mandatory for Terraform
    update:
      required: true

  # The cluster's /api/{serviceId}/service/delete is deliberately left
  # unannotated: it requires DELETE_SERVICE on the service itself, which an
  # organization token does not carry. Deletion goes through the IdP above.

  # Create returns the service but takes no serviceId, so read and update must be
  # told which state attribute supplies the path segment. service.apiKey is the
  # identifier Authlete resolves in the path (confirmed against the live API); it
  # is an int64, so the param is retyped to match.
  - target: $.paths['/api/{serviceId}/service/get'].get.parameters[?(@.name=='serviceId')].schema
    description: Correlate serviceId to service.apiKey
    update:
      type: integer
      format: int64
      x-speakeasy-match: apiKey

  - target: $.paths['/api/{serviceId}/service/update'].post.parameters[?(@.name=='serviceId')].schema
    description: Correlate serviceId to service.apiKey
    update:
      type: integer
      format: int64
      x-speakeasy-match: apiKey


  # ---------- Entity: Client ----------
  - target: $.components.schemas.client
    description: |
      Mark the client schema as a Terraform-managed entity. additionalProperties is
      closed because an open object cannot be given a stable generated type, which
      breaks type reconciliation on read/update/delete responses.
    update:
      x-speakeasy-entity: Client
      x-speakeasy-entity-version: 1
      additionalProperties: false

  - target: $.paths['/api/{serviceId}/client/create'].post
    description: Client create
    update:
      x-speakeasy-entity-operation: Client#create

  - target: $.paths['/api/{serviceId}/client/create'].post.requestBody
    description: Create body is mandatory for Terraform
    update:
      required: true

  - target: $.paths['/api/{serviceId}/client/get/{clientId}'].get
    description: Client read
    update:
      x-speakeasy-entity-operation: Client#read

  - target: $.paths['/api/{serviceId}/client/update/{clientId}'].post
    description: Client update
    update:
      x-speakeasy-entity-operation: Client#update

  - target: $.paths['/api/{serviceId}/client/update/{clientId}'].post.requestBody
    description: Update body is mandatory for Terraform
    update:
      required: true

  - target: $.paths['/api/{serviceId}/client/delete/{clientId}'].delete
    description: Client delete
    update:
      x-speakeasy-entity-operation: Client#delete

  # The clientId path parameter is typed as string, but client.clientId is an
  # int64. Speakeasy correlates the two by name and cannot reconcile a string
  # against an integer, so align the parameter with the field it refers to.
  - target: $.paths['/api/{serviceId}/client/get/{clientId}'].get.parameters[?(@.name=='clientId')].schema
    description: Align clientId path param with client.clientId
    update:
      type: integer
      format: int64

  - target: $.paths['/api/{serviceId}/client/update/{clientId}'].post.parameters[?(@.name=='clientId')].schema
    description: Align clientId path param with client.clientId
    update:
      type: integer
      format: int64

  - target: $.paths['/api/{serviceId}/client/delete/{clientId}'].delete.parameters[?(@.name=='clientId')].schema
    description: Align clientId path param with client.clientId
    update:
      type: integer
      format: int64

  # ---------- Secret handling ----------
  # Conceal server-assigned secrets from plan and apply console output. This is
  # console masking only: the values are still written to the state file, because
  # Terraform's write-only mechanism applies to arguments a practitioner supplies,
  # not to computed values read back from the API. Keeping these out of state
  # entirely needs an ephemeral resource, which is hand-written.
  - target: $.components.schemas.client.properties.clientSecret
    description: Conceal the client secret from console output
    update:
      x-speakeasy-param-sensitive: true

  - target: $.components.schemas.service.properties.apiSecret
    description: Conceal the service API secret from console output
    update:
      x-speakeasy-param-sensitive: true

  # The remaining secret-bearing fields. Verified unmasked: service jwks and
  # authentication_callback_api_secret were observed printing in plan output,
  # and the rest carry the same kind of material by schema.
  #
  # The JWK Sets are the serious ones. service.jwks must contain public/private
  # key pairs for asymmetric ID token signing, and credentialJwks is documented
  # as "containing private keys". A leaked client secret compromises one
  # application; a leaked service signing key lets someone mint tokens for every
  # client under that authorization server.
  #
  # Sensitive keeps these out of plan output, terraform state show and CI logs.
  # It does NOT remove them from state -- that is ENG-5904, and needs ephemeral
  # resources, which are not planned.
  #
  # Deliberately NOT marked: client.jwks ("must not include private keys of the
  # client application") and trustAnchors[].jwks ("public keys of the trust
  # anchor"). Both are public by contract, so masking them would cost
  # readability for no gain.

  - target: $.components.schemas.service.properties.jwks
    description: Conceal the service JWK Set, which holds private signing keys
    update:
      x-speakeasy-param-sensitive: true

  - target: $.components.schemas.service.properties.federationJwks
    description: Conceal the federation JWK Set, which signs entity statements
    update:
      x-speakeasy-param-sensitive: true

  - target: $.components.schemas.service.properties.credentialJwks
    description: Conceal the credential JWK Set, documented as holding private keys
    update:
      x-speakeasy-param-sensitive: true

  - target: $.components.schemas.service.properties.authenticationCallbackApiSecret
    description: Conceal the authentication callback secret
    update:
      x-speakeasy-param-sensitive: true

  - target: $.components.schemas.service.properties.developerAuthenticationCallbackApiSecret
    description: Conceal the developer authentication callback secret
    update:
      x-speakeasy-param-sensitive: true

  - target: $.components.schemas.sns_credentials.properties.apiSecret
    description: Conceal the SNS credential secret
    update:
      x-speakeasy-param-sensitive: true

  # ---------- JWK Set round-tripping ----------
  # Authlete returns a JWK Set with whitespace stripped and member keys
  # reordered, so a byte comparison reports a change on every plan after the
  # first apply. Measured against the live API: one such difference cascaded
  # into 214 attributes showing as "known after apply". Comparing by JSON
  # meaning instead removes the phantom diff entirely.
  - target: $.components.schemas.client.properties.jwks
    description: Compare the client JWK Set by meaning, not bytes
    update:
      x-speakeasy-terraform-custom-type:
        imports:
          - "github.com/authlete/terraform-provider-authlete/internal/provider/customtypes"
        schemaType: customtypes.JWKSType{}
        valueType: customtypes.JWKS

  - target: $.components.schemas.service.properties.jwks
    description: Compare the service JWK Set by meaning, not bytes
    update:
      x-speakeasy-terraform-custom-type:
        imports:
          - "github.com/authlete/terraform-provider-authlete/internal/provider/customtypes"
        schemaType: customtypes.JWKSType{}
        valueType: customtypes.JWKS

  - target: $.components.schemas.service.properties.federationJwks
    description: Compare the federation JWK Set by meaning, not bytes
    update:
      x-speakeasy-terraform-custom-type:
        imports:
          - "github.com/authlete/terraform-provider-authlete/internal/provider/customtypes"
        schemaType: customtypes.JWKSType{}
        valueType: customtypes.JWKS

  # ---------- Fields the server does not accept ----------
  # These are described as writable in the spec but never read from the request
  # by the server, so Terraform proposes a change, the server ignores it, the
  # value comes back unchanged, and the plan never converges. Verified field by
  # field against the live API and cross-checked against authlete/server at 3.0
  # HEAD (749e2b4cb).
  #
  # Marking them readOnly here mirrors the pending spec fix exactly, so each
  # action below can simply be deleted once the spec carries readOnly: true.


  # Dead since the /direct endpoints were removed from the server in May 2026
  # (a58158fcf, ENG-5636). The API still returns the keys, always false.
  - target: $.components.schemas.service.properties.directAuthorizationEndpointEnabled
    description: Dead field, server no longer reads it
    update:
      readOnly: true
      deprecated: true
  - target: $.components.schemas.service.properties.directTokenEndpointEnabled
    description: Dead field, server no longer reads it
    update:
      readOnly: true
      deprecated: true
  - target: $.components.schemas.service.properties.directIntrospectionEndpointEnabled
    description: Dead field, server no longer reads it
    update:
      readOnly: true
      deprecated: true
  - target: $.components.schemas.service.properties.directRevocationEndpointEnabled
    description: Dead field, server no longer reads it
    update:
      readOnly: true
      deprecated: true
  - target: $.components.schemas.service.properties.directUserInfoEndpointEnabled
    description: Dead field, server no longer reads it
    update:
      readOnly: true
      deprecated: true
  - target: $.components.schemas.service.properties.directJwksEndpointEnabled
    description: Dead field, server no longer reads it
    update:
      readOnly: true
      deprecated: true

  # Never read from the request by ServiceUpdateTask.
  - target: $.components.schemas.service.properties.clientIdAliasEnabled
    description: Server-assigned, not accepted from the request
    update:
      readOnly: true
  - target: $.components.schemas.service.properties.developerAuthenticationCallbackEndpoint
    description: Server-assigned, not accepted from the request
    update:
      readOnly: true
  - target: $.components.schemas.service.properties.developerAuthenticationCallbackApiKey
    description: Server-assigned, not accepted from the request
    update:
      readOnly: true
  - target: $.components.schemas.service.properties.developerAuthenticationCallbackApiSecret
    description: Server-assigned, not accepted from the request
    update:
      readOnly: true
  - target: $.components.schemas.service.properties.supportedSnses
    description: Server-assigned, not accepted from the request
    update:
      readOnly: true
  - target: $.components.schemas.service.properties.tokenBatchNotificationEndpoint
    description: Server-assigned, not accepted from the request
    update:
      readOnly: true

  # Never read from the request by ClientUpdateTask, or settable only through
  # the federation / metadata-document flows, which use their own schemas.
  - target: $.components.schemas.client.properties.clientIdAliasEnabled
    description: Server-assigned, not accepted from the request
    update:
      readOnly: true
  - target: $.components.schemas.client.properties.clientSource
    description: Server-assigned, not accepted from the request
    update:
      readOnly: true
  - target: $.components.schemas.client.properties.developer
    description: Server-assigned, not accepted from the request
    update:
      readOnly: true
  - target: $.components.schemas.client.properties.locked
    description: Server-assigned, not accepted from the request
    update:
      readOnly: true
  - target: $.components.schemas.client.properties.registrationAccessTokenHash
    description: Server-assigned, not accepted from the request
    update:
      readOnly: true
  - target: $.components.schemas.client.properties.trustChainUpdatedAt
    description: Server-assigned, not accepted from the request
    update:
      readOnly: true
  - target: $.components.schemas.client.properties.metadataDocumentUpdatedAt
    description: Server-assigned, not accepted from the request
    update:
      readOnly: true
  - target: $.components.schemas.client.properties.entityId
    description: Server-assigned, not accepted from the request
    update:
      readOnly: true
  - target: $.components.schemas.client.properties.trustAnchorId
    description: Server-assigned, not accepted from the request
    update:
      readOnly: true
  - target: $.components.schemas.client.properties.trustChainExpiresAt
    description: Server-assigned, not accepted from the request
    update:
      readOnly: true
  - target: $.components.schemas.client.properties.organizationName
    description: Server-assigned, not accepted from the request
    update:
      readOnly: true
  - target: $.components.schemas.client.properties.signedJwksUri
    description: Server-assigned, not accepted from the request
    update:
      readOnly: true
  - target: $.components.schemas.client.properties.clientRegistrationTypes
    description: Server-assigned, not accepted from the request
    update:
      readOnly: true
  - target: $.components.schemas.client.properties.automaticallyRegistered
    description: Server-assigned, not accepted from the request
    update:
      readOnly: true
  - target: $.components.schemas.client.properties.explicitlyRegistered
    description: Server-assigned, not accepted from the request
    update:
      readOnly: true
  - target: $.components.schemas.client.properties.metadataDocumentLocation
    description: Server-assigned, not accepted from the request
    update:
      readOnly: true
  - target: $.components.schemas.client.properties.metadataDocumentExpiresAt
    description: Server-assigned, not accepted from the request
    update:
      readOnly: true
  - target: $.components.schemas.client.properties.discoveredByMetadataDocument
    description: Server-assigned, not accepted from the request
    update:
      readOnly: true

  # ---------- Import safety ----------
  # organizationId and apiServerId are removed from the Terraform surface
  # entirely. Both are needed by the IdP to create and delete a service, but the
  # cluster read (GET /api/{serviceId}/service/get, which returns a bare
  # `service`) can never return them. Modelled as attributes they are null in
  # state after `terraform import`, and the generator marks them
  # RequiresReplaceIfConfigured -- so the first plan after any import proposed
  # destroying the authorization server and every client under it.
  #
  # Nothing declarative suppresses that: no extension disables force-new, a
  # custom plan modifier is appended *before* the generated one and so cannot
  # override it, and OpenAPI writeOnly is ignored here (it also cancels
  # x-speakeasy-param-optional). Removing the attributes instead is both the
  # smaller change and the better model -- these are account-level facts, not
  # per-service ones -- and idp_routing.go injects them into the IdP request
  # bodies the same way it already injects apiServerId.
  - target: $.components.schemas.service_create_idp_request.properties.organizationId
    description: Supplied by the provider, not modelled as a resource attribute
    update:
      x-speakeasy-terraform-ignore: true
  - target: $.components.schemas.service_create_idp_request.properties.apiServerId
    description: Supplied by the provider, not modelled as a resource attribute
    update:
      x-speakeasy-terraform-ignore: true

  # ---------- Provider-level configuration ----------
  # Declaring these as globals makes Speakeasy generate both the provider
  # attribute and the model struct field, which removes two of the three hand
  # edits this file previously needed in provider.go. Only the line that wraps
  # the transport remains hand-written.
  #
  # `in: path` is deliberate. Neither is actually a path parameter -- globals
  # only produce a provider attribute for parameters, not for request-body
  # fields, which was tried first and produced nothing. No operation declares a
  # parameter by either name, so nothing is injected into any URL; they exist
  # purely as provider configuration that idp_routing.go consumes.
  - target: $
    description: Expose idp_host and organization_id as provider attributes
    update:
      x-speakeasy-globals:
        parameters:
          - name: organizationId
            in: path
            schema:
              type: integer
              format: int64
          - name: idpHost
            in: path
            schema:
              type: string
          - name: apiServerId
            in: path
            schema:
              type: integer
              format: int64

  # ---------- Optional arrays: null must not be sent as [] ----------
  #
  # The generated Terraform->SDK conversion builds every list with
  # make([]T, 0, len(...)), which yields an empty but NON-nil slice when the
  # practitioner never set the attribute. The JSON tag is `omitzero`, and for a
  # slice only nil is the zero value, so an unset list serialises as [] instead
  # of being omitted. Authlete applies its defaults only when a key is ABSENT,
  # so the service is created supporting nothing. plan and apply are both clean
  # and the failure surfaces later at runtime, one error at a time: A015304
  # (displays), A009305 (response type), A049305 (grant type).
  #
  # The same generated function handles scalars correctly four lines earlier --
  # it allocates, checks IsNull/IsUnknown, and sets the pointer back to nil. The
  # inconsistency is a generator defect, reported upstream.
  #
  # Marking the array `nullable: true` makes the generator emit that same nil
  # guard for the list, on both the write and the read path. The Terraform
  # schema is unchanged (verified byte-identical), the SDK field stays []T, and
  # null / [] / populated now reach the wire as absent / [] / values.
  #
  # Deliberately limited to the seven fields where the server has a default and
  # the failure is known. A blanket sweep would flip ~40 further list attributes
  # from [] to null in state, and any config writing `= []` on one the server
  # does not echo back would then diff on every plan. Widen only per field, with
  # the round-trip verified against the live API.
  #
  # Guarded by TestOptionalArraysOmitNull in nullable_arrays_test.go.

  - target: $.components.schemas.service.properties.supportedDisplays
    description: Omit when unset so the server applies its default
    update:
      nullable: true

  - target: $.components.schemas.service.properties.supportedGrantTypes
    description: Omit when unset so the server applies its default
    update:
      nullable: true

  - target: $.components.schemas.service.properties.supportedResponseTypes
    description: Omit when unset so the server applies its default
    update:
      nullable: true

  - target: $.components.schemas.service.properties.supportedTokenAuthMethods
    description: Omit when unset so the server applies its default
    update:
      nullable: true

  - target: $.components.schemas.service.properties.supportedPromptValues
    description: Omit when unset so the server applies its default
    update:
      nullable: true

  - target: $.components.schemas.service.properties.supportedClaimTypes
    description: Omit when unset so the server applies its default
    update:
      nullable: true

  - target: $.components.schemas.client.properties.responseModes
    description: Omit when unset so the server applies its default
    update:
      nullable: true

  # ---------- mTLS certificate subject types ----------
  #
  # Authlete accepts exactly one way of identifying a client's certificate and
  # rejects a request naming two with A032216. These five attributes are
  # Optional+Computed, so removing one from configuration does not clear it:
  # Terraform keeps the last known value and the provider sends it alongside the
  # new one. Switching subject type therefore fails on every apply, and setting
  # the old attribute to "" does not help, because an empty string still counts
  # as naming it. The only escape is replacing the client, which changes its
  # client_id and breaks every application using it.
  #
  # The modifier clears an attribute configuration no longer names, when
  # configuration names a different one. Terraform renders the clearing in the
  # plan like any other change, so nothing happens silently. The ambiguous case
  # -- two named at once -- is refused at plan time instead, by the validator in
  # internal/provider/mtls_subject_validation.go.
  #
  # Speakeasy generates a stub per entry under
  # internal/planmodifiers/stringplanmodifier/ and writes it only when absent,
  # so the delegation to internal/provider/planmodifiers survives regeneration.

  - target: $.components.schemas.client.properties.tlsClientAuthSubjectDn
    description: Clear this subject type when configuration names a different one
    update:
      x-speakeasy-plan-modifiers:
        - ClearSuperseded_tls_client_auth_subject_dn

  - target: $.components.schemas.client.properties.tlsClientAuthSanDns
    description: Clear this subject type when configuration names a different one
    update:
      x-speakeasy-plan-modifiers:
        - ClearSuperseded_tls_client_auth_san_dns

  - target: $.components.schemas.client.properties.tlsClientAuthSanEmail
    description: Clear this subject type when configuration names a different one
    update:
      x-speakeasy-plan-modifiers:
        - ClearSuperseded_tls_client_auth_san_email

  - target: $.components.schemas.client.properties.tlsClientAuthSanIp
    description: Clear this subject type when configuration names a different one
    update:
      x-speakeasy-plan-modifiers:
        - ClearSuperseded_tls_client_auth_san_ip

  - target: $.components.schemas.client.properties.tlsClientAuthSanUri
    description: Clear this subject type when configuration names a different one
    update:
      x-speakeasy-plan-modifiers:
        - ClearSuperseded_tls_client_auth_san_uri

  # The mutually exclusive set is not discoverable from any one attribute, so
  # each says so. See internal/provider/planmodifiers/mtls_subject.go.

  - target: $.components.schemas.client.properties.tlsClientAuthSubjectDn
    description: Note the mutually exclusive set
    update:
      description: |-
        The string representation of the expected subject distinguished name of the certificate this
        client will use in mutual TLS authentication.

        See `tls_client_auth_subject_dn` in "Mutual TLS Profiles for OAuth Clients, 2.3. Dynamic Client
        Registration" for details.

        Authlete accepts exactly one of `tls_client_auth_subject_dn`, `tls_client_auth_san_dns`, `tls_client_auth_san_email`, `tls_client_auth_san_ip` and `tls_client_auth_san_uri`. To switch between them, delete the old line and add the new one: the provider clears the superseded value and shows it in the plan. Setting two at once is refused before anything is sent. An empty string does not clear one, because Authlete counts it as naming that subject type.

  - target: $.components.schemas.client.properties.tlsClientAuthSanDns
    description: Note the mutually exclusive set
    update:
      description: |-
        The string representation of the expected DNS subject alternative name of the certificate this
        client will use in mutual TLS authentication.

        See `tls_client_auth_san_dns` in "Mutual TLS Profiles for OAuth Clients, 2.3. Dynamic Client
        Registration" for details.

        Authlete accepts exactly one of `tls_client_auth_subject_dn`, `tls_client_auth_san_dns`, `tls_client_auth_san_email`, `tls_client_auth_san_ip` and `tls_client_auth_san_uri`. To switch between them, delete the old line and add the new one: the provider clears the superseded value and shows it in the plan. Setting two at once is refused before anything is sent. An empty string does not clear one, because Authlete counts it as naming that subject type.

  - target: $.components.schemas.client.properties.tlsClientAuthSanEmail
    description: Note the mutually exclusive set
    update:
      description: |-
        The string representation of the expected email address subject alternative name of the certificate
        this client will use in mutual TLS authentication.

        See `tls_client_auth_san_email` in "Mutual TLS Profiles for OAuth Clients, 2.3. Dynamic Client
        Registration" for details.

        Authlete accepts exactly one of `tls_client_auth_subject_dn`, `tls_client_auth_san_dns`, `tls_client_auth_san_email`, `tls_client_auth_san_ip` and `tls_client_auth_san_uri`. To switch between them, delete the old line and add the new one: the provider clears the superseded value and shows it in the plan. Setting two at once is refused before anything is sent. An empty string does not clear one, because Authlete counts it as naming that subject type.

  - target: $.components.schemas.client.properties.tlsClientAuthSanIp
    description: Note the mutually exclusive set
    update:
      description: |-
        The string representation of the expected IP address subject alternative name of the certificate
        this client will use in mutual TLS authentication.

        See `tls_client_auth_san_ip` in "Mutual TLS Profiles for OAuth Clients, 2.3. Dynamic Client
        Registration" for details.

        Authlete accepts exactly one of `tls_client_auth_subject_dn`, `tls_client_auth_san_dns`, `tls_client_auth_san_email`, `tls_client_auth_san_ip` and `tls_client_auth_san_uri`. To switch between them, delete the old line and add the new one: the provider clears the superseded value and shows it in the plan. Setting two at once is refused before anything is sent. An empty string does not clear one, because Authlete counts it as naming that subject type.

  - target: $.components.schemas.client.properties.tlsClientAuthSanUri
    description: Note the mutually exclusive set
    update:
      description: |-
        The string representation of the expected URI subject alternative name of the certificate this
        client will use in mutual TLS authentication.

        See `tls_client_auth_san_uri` in "Mutual TLS Profiles for OAuth Clients, 2.3. Dynamic Client
        Registration" for details.

        Authlete accepts exactly one of `tls_client_auth_subject_dn`, `tls_client_auth_san_dns`, `tls_client_auth_san_email`, `tls_client_auth_san_ip` and `tls_client_auth_san_uri`. To switch between them, delete the old line and add the new one: the provider clears the superseded value and shows it in the plan. Setting two at once is refused before anything is sent. An empty string does not clear one, because Authlete counts it as naming that subject type.

  # ---------- Fields the server ignores on write ----------
  #
  # Each of these is Optional+Computed, so a practitioner can set it, the apply
  # succeeds, Authlete discards the value, and the plan offers the same change on
  # every run without ever converging.
  #
  # Terraform has a built-in guard for exactly this: it errors when a provider
  # returns something other than what it planned. The generated create and update
  # overwrite the API response with the plan (refreshPlan), so the two can never
  # disagree and the guard never fires. That line is emitted unconditionally with
  # no configuration behind it -- see CUSTOMIZATION.md.
  #
  # readOnly removes the attribute from the writable surface, so there is no
  # desired value to compare against and no diff to settle.

  - target: $.components.schemas.service.properties.hsks
    description: HSM keys are managed through the separate HSK API, not here
    update:
      readOnly: true
      description: |-
        The information about keys managed on HSMs (Hardware Security Modules).

        This `hsks` property is output only, meaning that `hsks` in requests to `/api/service/create`
        API and `/api/service/update` API do not have any effect. The contents of this property is controlled
        only by `/api/hsk/*` APIs.

        Read-only. Hardware security module keys are managed through Authlete's separate HSK API, which this provider does not expose. The service create and update endpoints ignore this field, so a value written here is discarded silently and the plan never settles. What this returns is for reference.

  - target: $.components.schemas.service.properties.metadata
    description: Server-owned, so writes are ignored and diff forever
    update:
      readOnly: true
      description: |-
        The `metadata` of the service. The content of the returned array depends on contexts.
        The predefined service metadata is listed in the following table.

          | Key | Description |
          | --- | --- |
          | `clientCount` | The number of client applications which belong to this service.  |

        Read-only. Authlete owns these values -- `clientCount` changes as clients are added or removed -- and the service create and update endpoints ignore anything written here, including an empty list.

  # snsCredentials has no server-side storage at all, the same category as
  # apiSecret. Marked read-only rather than removed, so an existing configuration
  # setting it keeps planning rather than failing to parse.
  - target: $.components.schemas.service.properties.snsCredentials
    description: No server-side storage; read-only so it stops diffing
    update:
      readOnly: true

  # Documented, not enforced. A check could compare against the parent service's
  # allowlist, but only when Terraform can see that service -- not when it lives
  # in another configuration, and not when it is created in the same run without
  # the list written explicitly. That is the case someone new to this feature
  # hits, so the check would be quiet exactly where it is needed. Revisit if this
  # is reported in practice.
  - target: $.components.schemas.client.properties.customMetadata
    description: Note that undeclared keys are discarded
    update:
      description: |-
        The custom client metadata in JSON format.

        Authlete keeps only the keys declared in the parent service's `supported_custom_client_metadata`. Any other key is discarded silently: the apply succeeds, the key does not appear on the client, and every subsequent plan offers to add it again. Declare the key on the service before setting it here.
