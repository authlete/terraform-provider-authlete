overlay: 1.0.0
info:
  title: Authlete Terraform entity annotations
  version: 0.0.1
actions:
  # ---------- Entity: Service ----------
  - target: $.components.schemas.service
    description: Mark the service schema as a Terraform-managed entity
    update:
      x-speakeasy-entity: Service

  # Services are created and deleted through the IdP (login.authlete.com), NOT
  # through the regional cluster's /api/service/create. The cluster endpoint
  # returns 200 with a real apiKey, but the service it makes is attached to no
  # organization: the IdP cannot find it under any apiServerId, it never reaches
  # the audit log, and every service-scoped call afterwards fails A457101 with
  # insufficient rights. It also cannot be deleted again. Only the IdP endpoint
  # registers a service against an organization.

  # KNOWN LIMITATION -- on-premise and dedicated cloud cannot create or delete
  # services. The IdP host is fixed at https://login.authlete.com and the
  # generator bakes it in as a constant. Declaring it as an OpenAPI server
  # variable was tried and does NOT help: Speakeasy surfaces server variables as
  # configurable provider attributes only for root-level servers, and resolves
  # per-operation ones to their default at generation time. Fixing this needs
  # either an SDK hook that rewrites the host, or Speakeasy support for
  # operation-level server variables. Do not re-attempt via the overlay --
  # this is now solved at the HTTP layer in internal/provider/idp_routing.go.

  - target: $.paths['/api/service'].post
    description: Service create (IdP)
    update:
      x-speakeasy-entity-operation: Service#create

  - target: $.paths['/api/service/remove'].post
    description: Service delete (IdP), the counterpart of the IdP create
    update:
      x-speakeasy-entity-operation: Service#delete

  # The IdP delete takes the service ID in the body rather than the path, so it
  # needs the same correlation the cluster path params get.
  - target: $.components.schemas.service_remove_idp_request.properties.serviceId
    description: Correlate the IdP delete body's serviceId to service.apiKey
    update:
      x-speakeasy-match: apiKey

  - target: $.paths['/api/{serviceId}/service/get'].get
    description: Service read
    update:
      x-speakeasy-entity-operation: Service#read

  - target: $.paths['/api/{serviceId}/service/update'].post
    description: Service update
    update:
      x-speakeasy-entity-operation: Service#update

  - target: $.paths['/api/{serviceId}/service/update'].post.requestBody
    description: Update body is mandatory for Terraform
    update:
      required: true

  # The cluster's /api/{serviceId}/service/delete is deliberately left
  # unannotated: it requires DELETE_SERVICE on the service itself, which an
  # organization token does not carry. Deletion goes through the IdP above.

  # Create returns the service but takes no serviceId, so read and update must be
  # told which state attribute supplies the path segment. service.apiKey is the
  # identifier Authlete resolves in the path (confirmed against the live API); it
  # is an int64, so the param is retyped to match.
  - target: $.paths['/api/{serviceId}/service/get'].get.parameters[?(@.name=='serviceId')].schema
    description: Correlate serviceId to service.apiKey
    update:
      type: integer
      format: int64
      x-speakeasy-match: apiKey

  - target: $.paths['/api/{serviceId}/service/update'].post.parameters[?(@.name=='serviceId')].schema
    description: Correlate serviceId to service.apiKey
    update:
      type: integer
      format: int64
      x-speakeasy-match: apiKey


  # ---------- Entity: Client ----------
  - target: $.components.schemas.client
    description: |
      Mark the client schema as a Terraform-managed entity. additionalProperties is
      closed because an open object cannot be given a stable generated type, which
      breaks type reconciliation on read/update/delete responses.
    update:
      x-speakeasy-entity: Client
      additionalProperties: false

  - target: $.paths['/api/{serviceId}/client/create'].post
    description: Client create
    update:
      x-speakeasy-entity-operation: Client#create

  - target: $.paths['/api/{serviceId}/client/create'].post.requestBody
    description: Create body is mandatory for Terraform
    update:
      required: true

  - target: $.paths['/api/{serviceId}/client/get/{clientId}'].get
    description: Client read
    update:
      x-speakeasy-entity-operation: Client#read

  - target: $.paths['/api/{serviceId}/client/update/{clientId}'].post
    description: Client update
    update:
      x-speakeasy-entity-operation: Client#update

  - target: $.paths['/api/{serviceId}/client/update/{clientId}'].post.requestBody
    description: Update body is mandatory for Terraform
    update:
      required: true

  - target: $.paths['/api/{serviceId}/client/delete/{clientId}'].delete
    description: Client delete
    update:
      x-speakeasy-entity-operation: Client#delete

  # The clientId path parameter is typed as string, but client.clientId is an
  # int64. Speakeasy correlates the two by name and cannot reconcile a string
  # against an integer, so align the parameter with the field it refers to.
  - target: $.paths['/api/{serviceId}/client/get/{clientId}'].get.parameters[?(@.name=='clientId')].schema
    description: Align clientId path param with client.clientId
    update:
      type: integer
      format: int64

  - target: $.paths['/api/{serviceId}/client/update/{clientId}'].post.parameters[?(@.name=='clientId')].schema
    description: Align clientId path param with client.clientId
    update:
      type: integer
      format: int64

  - target: $.paths['/api/{serviceId}/client/delete/{clientId}'].delete.parameters[?(@.name=='clientId')].schema
    description: Align clientId path param with client.clientId
    update:
      type: integer
      format: int64

  # ---------- Secret handling ----------
  # Conceal server-assigned secrets from plan and apply console output. This is
  # console masking only: the values are still written to the state file, because
  # Terraform's write-only mechanism applies to arguments a practitioner supplies,
  # not to computed values read back from the API. Keeping these out of state
  # entirely needs an ephemeral resource, which is hand-written.
  - target: $.components.schemas.client.properties.clientSecret
    description: Conceal the client secret from console output
    update:
      x-speakeasy-param-sensitive: true

  - target: $.components.schemas.service.properties.apiSecret
    description: Conceal the service API secret from console output
    update:
      x-speakeasy-param-sensitive: true

  # ---------- JWK Set round-tripping ----------
  # Authlete returns a JWK Set with whitespace stripped and member keys
  # reordered, so a byte comparison reports a change on every plan after the
  # first apply. Measured against the live API: one such difference cascaded
  # into 214 attributes showing as "known after apply". Comparing by JSON
  # meaning instead removes the phantom diff entirely.
  - target: $.components.schemas.client.properties.jwks
    description: Compare the client JWK Set by meaning, not bytes
    update:
      x-speakeasy-terraform-custom-type:
        imports:
          - "github.com/authlete/terraform-provider-authlete/internal/provider/customtypes"
        schemaType: customtypes.JWKSType{}
        valueType: customtypes.JWKS

  - target: $.components.schemas.service.properties.jwks
    description: Compare the service JWK Set by meaning, not bytes
    update:
      x-speakeasy-terraform-custom-type:
        imports:
          - "github.com/authlete/terraform-provider-authlete/internal/provider/customtypes"
        schemaType: customtypes.JWKSType{}
        valueType: customtypes.JWKS

  - target: $.components.schemas.service.properties.federationJwks
    description: Compare the federation JWK Set by meaning, not bytes
    update:
      x-speakeasy-terraform-custom-type:
        imports:
          - "github.com/authlete/terraform-provider-authlete/internal/provider/customtypes"
        schemaType: customtypes.JWKSType{}
        valueType: customtypes.JWKS

  # ---------- Fields the server does not accept ----------
  # These are described as writable in the spec but never read from the request
  # by the server, so Terraform proposes a change, the server ignores it, the
  # value comes back unchanged, and the plan never converges. Verified field by
  # field against the live API and cross-checked against authlete/server at 3.0
  # HEAD (749e2b4cb).
  #
  # Marking them readOnly here mirrors the pending spec fix exactly, so each
  # action below can simply be deleted once the spec carries readOnly: true.


  # Dead since the /direct endpoints were removed from the server in May 2026
  # (a58158fcf, ENG-5636). The API still returns the keys, always false.
  - target: $.components.schemas.service.properties.directAuthorizationEndpointEnabled
    description: Dead field, server no longer reads it
    update:
      readOnly: true
      deprecated: true
  - target: $.components.schemas.service.properties.directTokenEndpointEnabled
    description: Dead field, server no longer reads it
    update:
      readOnly: true
      deprecated: true
  - target: $.components.schemas.service.properties.directIntrospectionEndpointEnabled
    description: Dead field, server no longer reads it
    update:
      readOnly: true
      deprecated: true
  - target: $.components.schemas.service.properties.directRevocationEndpointEnabled
    description: Dead field, server no longer reads it
    update:
      readOnly: true
      deprecated: true
  - target: $.components.schemas.service.properties.directUserInfoEndpointEnabled
    description: Dead field, server no longer reads it
    update:
      readOnly: true
      deprecated: true
  - target: $.components.schemas.service.properties.directJwksEndpointEnabled
    description: Dead field, server no longer reads it
    update:
      readOnly: true
      deprecated: true

  # Never read from the request by ServiceUpdateTask.
  - target: $.components.schemas.service.properties.clientIdAliasEnabled
    description: Server-assigned, not accepted from the request
    update:
      readOnly: true
  - target: $.components.schemas.service.properties.developerAuthenticationCallbackEndpoint
    description: Server-assigned, not accepted from the request
    update:
      readOnly: true
  - target: $.components.schemas.service.properties.developerAuthenticationCallbackApiKey
    description: Server-assigned, not accepted from the request
    update:
      readOnly: true
  - target: $.components.schemas.service.properties.developerAuthenticationCallbackApiSecret
    description: Server-assigned, not accepted from the request
    update:
      readOnly: true
  - target: $.components.schemas.service.properties.supportedSnses
    description: Server-assigned, not accepted from the request
    update:
      readOnly: true
  - target: $.components.schemas.service.properties.tokenBatchNotificationEndpoint
    description: Server-assigned, not accepted from the request
    update:
      readOnly: true

  # Never read from the request by ClientUpdateTask, or settable only through
  # the federation / metadata-document flows, which use their own schemas.
  - target: $.components.schemas.client.properties.clientIdAliasEnabled
    description: Server-assigned, not accepted from the request
    update:
      readOnly: true
  - target: $.components.schemas.client.properties.clientSource
    description: Server-assigned, not accepted from the request
    update:
      readOnly: true
  - target: $.components.schemas.client.properties.developer
    description: Server-assigned, not accepted from the request
    update:
      readOnly: true
  - target: $.components.schemas.client.properties.locked
    description: Server-assigned, not accepted from the request
    update:
      readOnly: true
  - target: $.components.schemas.client.properties.registrationAccessTokenHash
    description: Server-assigned, not accepted from the request
    update:
      readOnly: true
  - target: $.components.schemas.client.properties.trustChainUpdatedAt
    description: Server-assigned, not accepted from the request
    update:
      readOnly: true
  - target: $.components.schemas.client.properties.metadataDocumentUpdatedAt
    description: Server-assigned, not accepted from the request
    update:
      readOnly: true
  - target: $.components.schemas.client.properties.entityId
    description: Server-assigned, not accepted from the request
    update:
      readOnly: true
  - target: $.components.schemas.client.properties.trustAnchorId
    description: Server-assigned, not accepted from the request
    update:
      readOnly: true
  - target: $.components.schemas.client.properties.trustChainExpiresAt
    description: Server-assigned, not accepted from the request
    update:
      readOnly: true
  - target: $.components.schemas.client.properties.organizationName
    description: Server-assigned, not accepted from the request
    update:
      readOnly: true
  - target: $.components.schemas.client.properties.signedJwksUri
    description: Server-assigned, not accepted from the request
    update:
      readOnly: true
  - target: $.components.schemas.client.properties.clientRegistrationTypes
    description: Server-assigned, not accepted from the request
    update:
      readOnly: true
  - target: $.components.schemas.client.properties.automaticallyRegistered
    description: Server-assigned, not accepted from the request
    update:
      readOnly: true
  - target: $.components.schemas.client.properties.explicitlyRegistered
    description: Server-assigned, not accepted from the request
    update:
      readOnly: true
  - target: $.components.schemas.client.properties.metadataDocumentLocation
    description: Server-assigned, not accepted from the request
    update:
      readOnly: true
  - target: $.components.schemas.client.properties.metadataDocumentExpiresAt
    description: Server-assigned, not accepted from the request
    update:
      readOnly: true
  - target: $.components.schemas.client.properties.discoveredByMetadataDocument
    description: Server-assigned, not accepted from the request
    update:
      readOnly: true

  # ---------- Import safety ----------
  # organizationId and apiServerId are removed from the Terraform surface
  # entirely. Both are needed by the IdP to create and delete a service, but the
  # cluster read (GET /api/{serviceId}/service/get, which returns a bare
  # `service`) can never return them. Modelled as attributes they are null in
  # state after `terraform import`, and the generator marks them
  # RequiresReplaceIfConfigured -- so the first plan after any import proposed
  # destroying the authorization server and every client under it.
  #
  # Nothing declarative suppresses that: no extension disables force-new, a
  # custom plan modifier is appended *before* the generated one and so cannot
  # override it, and OpenAPI writeOnly is ignored here (it also cancels
  # x-speakeasy-param-optional). Removing the attributes instead is both the
  # smaller change and the better model -- these are account-level facts, not
  # per-service ones -- and idp_routing.go injects them into the IdP request
  # bodies the same way it already injects apiServerId.
  - target: $.components.schemas.service_create_idp_request.properties.organizationId
    description: Supplied by the provider, not modelled as a resource attribute
    update:
      x-speakeasy-terraform-ignore: true
  - target: $.components.schemas.service_create_idp_request.properties.apiServerId
    description: Supplied by the provider, not modelled as a resource attribute
    update:
      x-speakeasy-terraform-ignore: true

  # ---------- Provider-level configuration ----------
  # Declaring these as globals makes Speakeasy generate both the provider
  # attribute and the model struct field, which removes two of the three hand
  # edits this file previously needed in provider.go. Only the line that wraps
  # the transport remains hand-written.
  #
  # `in: path` is deliberate. Neither is actually a path parameter -- globals
  # only produce a provider attribute for parameters, not for request-body
  # fields, which was tried first and produced nothing. No operation declares a
  # parameter by either name, so nothing is injected into any URL; they exist
  # purely as provider configuration that idp_routing.go consumes.
  - target: $
    description: Expose idp_host and organization_id as provider attributes
    update:
      x-speakeasy-globals:
        parameters:
          - name: organizationId
            in: path
            schema:
              type: integer
              format: int64
          - name: idpHost
            in: path
            schema:
              type: string
          - name: apiServerId
            in: path
            schema:
              type: integer
              format: int64
