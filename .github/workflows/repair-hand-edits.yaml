# Repairs the hand edits under internal/provider after a regeneration.
#
# Speakeasy's Generate workflow can drop any of them. None of these failures
# breaks the build, which is the whole problem: the provider still compiles,
# lints and generates while quietly missing an edit.
#
# This workflow runs after Generate finishes, checks every patch script, and if
# any is missing opens a pull request that puts them back. The same scripts are
# checked on every pull request by test.yaml, so a regeneration branch that
# nothing repaired still fails before it can be merged.
#
# Keep this list and the one in test.yaml in step with scripts/patch-*.
#
# It uses workflow_run rather than pull_request deliberately: Generate
# authenticates with GITHUB_TOKEN, and GitHub does not trigger pull_request
# workflows from events created by that token. workflow_run fires regardless.
name: Repair hand edits

on:
  workflow_run:
    workflows: ["Generate"]
    types: [completed]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to check
        type: string
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Work out which branch to check
        id: target
        run: |
          branch="${{ inputs.branch || github.event.workflow_run.head_branch }}"
          if [ -z "$branch" ]; then
            echo "No branch to check; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.target.outputs.skip != 'true'
        with:
          ref: ${{ steps.target.outputs.branch }}
          fetch-depth: 0

      - name: Are the patches still there?
        if: steps.target.outputs.skip != 'true'
        id: check
        run: |
          if ./scripts/patch-provider.sh --check && ./scripts/patch-empty-lists.sh --check \
             && ./scripts/patch-debug-response.sh --check \
             && python3 scripts/patch-resource-server-url.py --check \
             && python3 scripts/patch-deprecated-example.py --check \
             && python3 scripts/patch-list-order.py --check \
             && python3 scripts/patch-missing-service.py --check \
             && python3 scripts/fill-keep-order-stubs.py --check; then
            echo "needs_repair=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_repair=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Re-apply them and open a pull request
        if: steps.check.outputs.needs_repair == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.target.outputs.branch }}
        run: |
          set -euo pipefail
          ./scripts/patch-provider.sh
          ./scripts/patch-empty-lists.sh
          ./scripts/patch-debug-response.sh
          python3 scripts/patch-resource-server-url.py
          python3 scripts/patch-deprecated-example.py
          python3 scripts/patch-list-order.py
          python3 scripts/patch-missing-service.py
          python3 scripts/fill-keep-order-stubs.py

          fix_branch="repair/provider-patch-${GITHUB_RUN_ID}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$fix_branch"
          git add -A internal/provider
          git commit -m "Re-apply the post-generation patches

          The last regeneration dropped at least one of the edits that survive
          through Speakeasy's three-way merge. None of them breaks the build,
          which is why they are caught here.

          provider.go: without the transport wrapper, idp_host and
          organization_id are accepted and silently ignored, so service create
          and delete go to Authlete's shared cloud regardless of configuration.

          The *_sdk.go reads: without the empty-list mapping, a list explicitly
          set to [] reads back as null, so the configuration plans the same
          change forever.

          The Read functions: without the list-order patch, Authlete's order
          overwrites the configured one in state, so every plan reports the
          resource as changing.

          Re-applied with the scripts/patch-* scripts."
          git push origin "$fix_branch"

          gh pr create \
            --base "$BASE" \
            --head "$fix_branch" \
            --title "Re-apply the post-generation patches" \
            --body "The last regeneration dropped one or both of the edits under \`internal/provider\`.

          Neither failure breaks the build, which is why this is caught here rather than by the compiler.

          - \`provider.go\`: without the transport wrapper, \`idp_host\` and \`organization_id\` are accepted and silently ignored, so service create and delete go to Authlete's shared cloud regardless of configuration.
          - the \`*_sdk.go\` reads: without the empty-list mapping, a list explicitly set to \`[]\` reads back as null, so the configuration plans the same change forever.

          - the \`Read\` functions: without the list-order patch, Authlete's order overwrites the configured one in state, so every plan reports the resource as changing.

          Re-applied automatically with the \`scripts/patch-*\` scripts. Merge this into \`$BASE\` before merging that branch."

      - name: Nothing to do
        if: steps.check.outputs.needs_repair == 'false'
        run: echo "Every patch is present on ${{ steps.target.outputs.branch }}."
